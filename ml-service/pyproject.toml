[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chanuth Dewhan", email = "chanuthdewhan273@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "ipywidgets>=8.1.9",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "uvicorn>=0.52.4",
    "xgboost-cpu>=3.4.1",
]

[project.scripts]
ml-service = "ml_service:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
