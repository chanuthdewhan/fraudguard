name: CI - ML Service

on:
  pull_request:
    paths:
      - "ml-service/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv sync
      - run: uv run ruff check .
      # No tests written yet.
      # - run: uv run pytest